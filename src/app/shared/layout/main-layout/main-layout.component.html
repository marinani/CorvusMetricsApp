<mat-sidenav-container class="app-layout" (backdropClick)="sidenavOpened.set(false)">
  <mat-sidenav
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="sidenavOpened()"
    position="start"
    class="app-sidenav"
  >
    <div class="sidenav-brand">
      <img class="brand-img" src="/logo-fundo-dark.svg" alt="Corvus Metrics logo" />
    
    </div>

    <mat-nav-list class="sidenav-nav">
      @for (section of navSections; track section.label) {
        <div class="nav-section">
          <span class="nav-section-label">{{ section.label }}</span>

          @for (item of section.items; track item.path) {
            <a
              mat-list-item
              class="nav-item"
              [routerLink]="['/', item.path]"
              routerLinkActive="nav-item--active"
              (click)="closeSidenav()"
            >
              <mat-icon matListItemIcon fontSet="material-icons-outlined">{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        </div>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <mat-toolbar class="app-toolbar">
      <button
        mat-icon-button
        class="toolbar-toggle"
        aria-label="Toggle navigation"
        (click)="toggleSidenav()"
      >
        <mat-icon fontSet="material-icons-outlined">menu</mat-icon>
      </button>

      <span class="toolbar-title">
        CORVUS <span class="brand-accent">METRICS</span>
      </span>

      <span class="toolbar-spacer"></span>

      <span class="toolbar-user">
        @if (displayName()) {
          <span class="toolbar-user-name">{{ displayName() }}</span>
        }
        <button mat-icon-button aria-label="User menu" matTooltip="Sign out" (click)="logout()">
          <mat-icon fontSet="material-icons-outlined">logout</mat-icon>
        </button>
      </span>
    </mat-toolbar>

    <main class="page-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
