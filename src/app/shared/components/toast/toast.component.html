<div class="toast toast--{{ data.type }}" role="status">
  <mat-icon class="toast__icon" fontSet="material-icons-outlined">{{ icon }}</mat-icon>
  <span class="toast__message">{{ data.message }}</span>
  <button
    type="button"
    class="toast__close"
    (click)="snackBarRef.dismiss()"
    aria-label="Dismiss notification"
  >
    <mat-icon fontSet="material-icons-outlined">close</mat-icon>
  </button>
</div>
