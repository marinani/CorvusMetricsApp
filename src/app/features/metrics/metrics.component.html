<app-page-header
  title="Metrics"
  subtitle="Monitor performance indicators across your companies"
/>

<mat-card class="corvus-panel">
  @if (metricsResource.isLoading()) {
    <div class="loading-state">
      <mat-spinner diameter="36" />
    </div>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="metricsResource.value() ?? []" class="corvus-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let metric">{{ metric.name }}</td>
        </ng-container>

        <ng-container matColumnDef="period">
          <th mat-header-cell *matHeaderCellDef>Period</th>
          <td mat-cell *matCellDef="let metric" class="period-cell">
            {{ metric.period | titlecase }}
          </td>
        </ng-container>

        <ng-container matColumnDef="value">
          <th mat-header-cell *matHeaderCellDef>Value</th>
          <td mat-cell *matCellDef="let metric" class="value-cell">
            {{ metric.value | number: '1.1-2' }} {{ metric.unit }}
          </td>
        </ng-container>

        <ng-container matColumnDef="target">
          <th mat-header-cell *matHeaderCellDef>Target</th>
          <td mat-cell *matCellDef="let metric" class="value-cell muted">
            {{ metric.target | number: '1.1-2' }} {{ metric.unit }}
          </td>
        </ng-container>

        <ng-container matColumnDef="trend">
          <th mat-header-cell *matHeaderCellDef>Trend</th>
          <td mat-cell *matCellDef="let metric">
            <mat-icon
              class="trend-icon"
              [class.trend-icon--up]="metric.trend === 'up'"
              [class.trend-icon--warn]="metric.trend === 'warn'"
              [class.trend-icon--down]="metric.trend === 'down'"
              fontSet="material-icons-outlined"
            >
              {{ getTrendIcon(metric.trend) }}
            </mat-icon>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  }
</mat-card>
