<app-page-header
  title="Companies"
  subtitle="Manage the companies tracked by Corvus Metrics"
/>

<mat-card class="corvus-panel">
  @if (companiesResource.isLoading()) {
    <div class="loading-state">
      <mat-spinner diameter="36" />
    </div>
  } @else {
    <div class="table-container">
      <table mat-table [dataSource]="companiesResource.value() ?? []" class="corvus-table">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let company">{{ company.name }}</td>
        </ng-container>

        <ng-container matColumnDef="industry">
          <th mat-header-cell *matHeaderCellDef>Industry</th>
          <td mat-cell *matCellDef="let company">{{ company.industry }}</td>
        </ng-container>

        <ng-container matColumnDef="cnpj">
          <th mat-header-cell *matHeaderCellDef>CNPJ</th>
          <td mat-cell *matCellDef="let company">{{ company.cnpj }}</td>
        </ng-container>

        <ng-container matColumnDef="active">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let company">
            <span
              class="status-chip"
              [class.status-chip--active]="company.active"
              [class.status-chip--inactive]="!company.active"
            >
              {{ getStatusLabel(company.active) }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdAt">
          <th mat-header-cell *matHeaderCellDef>Created</th>
          <td mat-cell *matCellDef="let company">{{ company.createdAt | date: 'MMM d, y' }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    </div>
  }
</mat-card>
